name: joinlet
services:
  joinlet:
    image: joinlet-remote:${JOINLET_RELEASE:-beta}
    build:
      context: ..
      dockerfile: apps/remote/Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "8788"
      STRUKT_REMOTE_DB: /data/remote.sqlite
      JOINLET_TRUST_PROXY_HOPS: "1"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - joinlet_data:/data
    expose:
      - "8788"
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: "2"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  repository-worker:
    image: joinlet-remote:${JOINLET_RELEASE:-beta}
    env_file: .env.production
    environment:
      NODE_ENV: production
      STRUKT_REMOTE_DB: /data/remote.sqlite
      JOINLET_REPOSITORY_WORKER: "1"
    command: ["bun", "apps/remote/src/repositoryWorker.ts"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - joinlet_data:/data
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: "2"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    depends_on:
      joinlet:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      JOINLET_DOMAIN: ${JOINLET_DOMAIN:-joinlet.co}
      JOINLET_APP_DOMAIN: ${JOINLET_APP_DOMAIN:-app.joinlet.co}
      JOINLET_ACME_EMAIL: ${JOINLET_ACME_EMAIL:?Set JOINLET_ACME_EMAIL for certificate notices}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      joinlet:
        condition: service_healthy
volumes:
  joinlet_data:
  caddy_data:
  caddy_config:
