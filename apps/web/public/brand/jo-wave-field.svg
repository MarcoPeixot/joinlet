    </radialGradient>
    <linearGradient id="edge" x1="0" y1="340" x2="0" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".16" stop-color="white"/>
      <stop offset=".8" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="falloff"><path fill="url(#edge)" d="M1318 340h218v250h-218z"/></mask>
