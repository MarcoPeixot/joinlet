name: Joinlet checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: joinlet-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run verify:knowledge
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run --filter @strukt/web e2e chat.spec.ts --grep 'sends the diagram|while it is being written'
      - run: bun run --filter @strukt/web e2e sketch-design.spec.ts hosted.spec.ts
      - run: docker build -f apps/remote/Dockerfile -t joinlet-remote:check .
      - run: bun scripts/smoke-container.ts joinlet-remote:check
