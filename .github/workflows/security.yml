name: Public repository boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public file boundaries
        run: |
          python3 -m unittest discover -s scripts -p test_publication.py
          python3 scripts/check-publication.py
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify scanner resists repository suppressions
        run: python3 scripts/test_secret_scanner.py "$RUNNER_TEMP/gitleaks"
      - name: Scan all fetched Git history and checkout
        shell: bash
        run: |
          python3 scripts/check-secrets.py "$RUNNER_TEMP/gitleaks"
